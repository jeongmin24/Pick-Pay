spring.application.name=paymanagement
spring.config.import=optional:file:../.env[.properties]

# DB 설정 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pickpay?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_NAME}
spring.datasource.password=${DB_PASS}

# JPA / Hibernate 설정 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

pg.secret-key=${PG_SECRET_KEY}
pg.confirm-url=${TOSS_CONFIRM_URL:https://api.tosspayments.com/v1/payments/confirm}
pg.cancel-url=${TOSS_CANCEL_URL:https://api.tosspayments.com/v1/payments/{paymentKey}/cancel}
